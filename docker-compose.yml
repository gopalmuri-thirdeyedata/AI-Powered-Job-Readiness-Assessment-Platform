# ==============================================================================
# HIRINGAI PRODUCTION DOCKER COMPOSE ORCHESTRATION
# ==============================================================================

services:
  # MySQL Database Server
  db:
    image: mysql:8.0
    container_name: hiringai_mysql_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-hiringai_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-hiringai}
      MYSQL_USER: ${DB_USER:-hiringai_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hiringai_pass}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - hiringai_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: hiringai_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    networks:
      - hiringai_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Demo code runner (Judge0-compatible, Python + Java + C++ + C). Internal network only - never publish its port.
  code_runner:
    build:
      context: ./code-runner
    container_name: hiringai_code_runner
    restart: always
    mem_limit: 2g
    networks:
      - hiringai_internal

  # FastAPI ASGI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiringai_backend_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      # SQLite file on a persistent volume: saved profiles survive logout, restarts and rebuilds
      - DATABASE_URL=sqlite:////app/data/PrepWin.db
      # Demo-only Java/Python runner (the public Judge0 is overloaded); use a real Judge0 for production
      - JUDGE0_API_URL=http://code_runner:2358/submissions
    volumes:
      - backend_media:/app/media
      - backend_data:/app/data
    networks:
      - hiringai_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s


  # Frontend Single Page Application (Nginx static)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: hiringai_frontend_prod
    restart: always
    networks:
      - hiringai_internal
    depends_on:
      - backend


  # Edge Nginx Reverse Proxy
  reverse_proxy:
    image: nginx:alpine
    container_name: hiringai_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - hiringai_internal
    depends_on:
      - backend
      - frontend

networks:
  hiringai_internal:
    driver: bridge

volumes:
  mysql_prod_data:
  redis_prod_data:
  backend_media:
  backend_data:
  certbot_certs:
  certbot_www:
