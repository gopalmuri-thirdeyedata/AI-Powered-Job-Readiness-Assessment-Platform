services:
  db:
    image: mysql:8.0
    container_name: interviewer_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-InterviewerPass2026}
      MYSQL_DATABASE: ${DB_NAME:-hiringai}
      MYSQL_USER: ${DB_USER:-hiringai_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-InterviewerPass2026}
    volumes:
      - interviewer_mysql_data:/var/lib/mysql
    networks:
      - interviewer_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_PASSWORD:-InterviewerPass2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: interviewer_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - interviewer_redis_data:/data
    networks:
      - interviewer_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # scripts/build-images.sh sets BACKEND_BASE_IMAGE to a prebuilt, tagged dependency image; unset = build the `deps` stage inline
        BASE_IMAGE: ${BACKEND_BASE_IMAGE:-deps}
    image: interviewer-platform-backend
    container_name: interviewer_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://hiringai_user:InterviewerPass2026@db:3306/hiringai
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=hiringai_user
      - DB_PASSWORD=InterviewerPass2026
      - DB_NAME=hiringai
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=https://interviewer.learningpath.ai
      - CORS_ORIGINS=https://interviewer.learningpath.ai,http://localhost:8212,http://127.0.0.1:8212
      # Code execution: the in-house runner first (private runner_net, no auth token); Judge0 (JUDGE0_API_URL from backend/.env) only
      # when the runner cannot serve a request
      - CODE_RUNNER_URL=http://code_runner:2358/submissions
      - CODE_EXECUTION_ENGINE=judge0
      - SANDBOX_MAX_CONCURRENCY=2
      # Student code runs wait in a fair line per worker: 4 workers x 2 = 8 = the runner's uid slots (RUNNER_UIDS below)
      - STUDENT_SANDBOX_CONCURRENCY=2
    volumes:
      - interviewer_media:/app/media
    networks:
      - interviewer_net
      - runner_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      code_runner:
        condition: service_started      # not service_healthy: a broken runner must not stop the backend (Judge0 is the fallback)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  code_runner:
    build:
      context: ./code-runner
    image: interviewer-platform-code_runner
    container_name: interviewer_code_runner
    restart: always
    init: true            # reaps the orphaned children a fork bomb leaves behind (PID 1 is a Python server that does not)
    environment:
      # 8 throwaway uids = 8 submissions at once (a batch of tests holds ONE slot). Keep backend workers x STUDENT_SANDBOX_CONCURRENCY at or below this.
      - RUNNER_UIDS=10001,10002,10003,10004,10005,10006,10007,10008
    networks:
      - runner_net
    mem_limit: 5g         # g++ needs ~300-500 MB per compile; 8 slots at once
    memswap_limit: 5g
    cpus: 4.0
    pids_limit: 768       # 8 slots x (compiler: g++ + cc1plus + as + ld, or a run) + the per-uid RLIMIT_NPROC of 128 is the real fork-bomb cap
    read_only: true
    tmpfs:
      - /tmp/runs:size=256m,mode=0755,exec,nosuid      # "exec" must be explicit: Docker mounts tmpfs noexec by default, and compiled C / C++ programs run from here
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2358/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: interviewer-platform-frontend
    container_name: interviewer_frontend
    restart: always
    networks:
      - interviewer_net
    depends_on:
      - backend

  reverse_proxy:
    image: nginx:alpine
    container_name: interviewer_proxy
    restart: always
    ports:
      - "8212:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - interviewer_net
    depends_on:
      - backend
      - frontend

networks:
  interviewer_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.0.0/24
  runner_net:
    driver: bridge
    internal: true        # no outbound internet, no route to the host

volumes:
  interviewer_mysql_data:
  interviewer_redis_data:
  interviewer_media:
