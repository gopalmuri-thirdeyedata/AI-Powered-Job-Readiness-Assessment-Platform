services:
  db:
    image: mysql:8.0
    container_name: interviewer_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-InterviewerPass2026}
      MYSQL_DATABASE: ${DB_NAME:-hiringai}
      MYSQL_USER: ${DB_USER:-hiringai_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-InterviewerPass2026}
    volumes:
      - interviewer_mysql_data:/var/lib/mysql
    networks:
      - interviewer_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_PASSWORD:-InterviewerPass2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: interviewer_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - interviewer_redis_data:/data
    networks:
      - interviewer_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewer_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://hiringai_user:InterviewerPass2026@db:3306/hiringai
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=hiringai_user
      - DB_PASSWORD=InterviewerPass2026
      - DB_NAME=hiringai
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=https://interviewer.thirdeyedata.ai
      - CORS_ORIGINS=https://interviewer.thirdeyedata.ai,http://localhost:8212,http://127.0.0.1:8212
    volumes:
      - interviewer_media:/app/media
    networks:
      - interviewer_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_VAPI_PUBLIC_KEY: 0faeae3d-541b-4a79-8320-816c202d38b9
    container_name: interviewer_frontend
    restart: always
    networks:
      - interviewer_net
    depends_on:
      - backend

  reverse_proxy:
    image: nginx:alpine
    container_name: interviewer_proxy
    restart: always
    ports:
      - "8212:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - interviewer_net
    depends_on:
      - backend
      - frontend

networks:
  interviewer_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.97.0.0/24

volumes:
  interviewer_mysql_data:
  interviewer_redis_data:
  interviewer_media:
